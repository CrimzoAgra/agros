name: CI

on:
  push:
    # (not for a change to the docs alone, their images too: no package holds them, the daily run below still checks
    # all. But the Lua API table, docs/how-it-works.md, which hypr-config's test reads. The last match wins, as
    # agros-iso's iso.yml)
    paths:
      - '**'
      - '!**.md'
      - '!docs/images/**'
      - 'docs/how-it-works.md'
  pull_request:
  # Daily: the AUR packages AgrOS carries rebuilt when they've moved on (and against the latest Arch libraries)
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# One run at a time, the newest push queued behind it (an older one waiting is dropped): runs finishing out of order
# published an older commit over a newer one, and cancelling the running one meant a busy day published nothing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
# (each job with a time limit a few times its usual length: a hang stopped, not run on to GitHub's 6 hours with the
# queued run behind it waiting all that time)

permissions:
  contents: read

# On main: the repo built first (repo), then tested (test: on what it built; when some fail, which side broke them, and
# that held back alone, ci/test-passes.sh), then what passed signed and put out (release), and said (report: one issue).
# A pull request or another branch: only the tests, on the published repo.
# AgrOS's signing key (the AGROS_GPG_KEY secret) is only ever in the release job's signing step: repo runs AUR build
# scripts (as its builder user, with sudo), test runs what was built and the tests, so neither has it and the repo goes
# between them unsigned; the release job runs none of that (tests/ci-signing.sh checks this file for it)
jobs:
  test:
    needs: [agros, repo]
    # (the build skipped, a pull request: on the published repo; not when AgrOS's own packages didn't build)
    if: ${{ always() && needs.agros.result != 'failure' && (needs.repo.result == 'success' || needs.repo.result == 'skipped') }}
    outputs:
      result: ${{ steps.tests.outputs.result }}
      gated: ${{ steps.gated.outputs.gated }}
      approved: ${{ steps.approved.outputs.approved }}
    runs-on: ubuntu-26.04
    # (three passes of the tests at most, ci/test-passes.sh, each test within run.sh's own time limit)
    timeout-minutes: 90
    # (privileged: game-focus-audio's user namespaces)
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Tools the tests use
        run: |
          # (only what isn't there: pacman warns about each one asked for that is). Node, qmllint, Hyprland's and
          # Thunar's headers with a compiler (hyprbars and the Thunar plugin built), mkinitcpio, bubblewrap and passt
          # (the boot's AUR sandbox and its network, checked for real: the host's loopback out of its reach), uwsm (its
          # Hyprland unit, agros-vmware's drop-in checked beside it), squashfs-tools (appimage-open reads an AppImage with
          # it), dash (nvidia-vaapi runs its sh file in a strict POSIX shell too) and desktop-file-utils (desktop-entries
          # validates the launchers; both only when there, said nowhere): the tests that check against them
          pkgs=(git jq python python-yaml python-gobject python-xlib python-secretstorage gnupg shellcheck sudo libnotify fish
            procps-ng util-linux which diffutils pacman-contrib file gtk3 thunar lua lutris nodejs qt6-declarative hyprland
            base-devel mkinitcpio bubblewrap passt xdg-desktop-portal-hyprland uwsm squashfs-tools dash desktop-file-utils)
          # (a machine id: without one systemd's install hooks warn that /etc isn't set up; and its hook that loads a
          # package's kernel modules off: no systemd running here, it fails)
          systemd-machine-id-setup >/dev/null
          mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/36-systemd-modules-load.hook
          pacman -Sy
          pacman -Su --noconfirm --needed $(pacman -T "${pkgs[@]}")
          # A kernel's modules for nvidia-early, unpacked rather than installed: its install hook builds an initramfs,
          # which fails in a container
          pacman -Sw --noconfirm linux >/dev/null
          bsdtar -xf "$(ls /var/cache/pacman/pkg/linux-[0-9]*.pkg.tar.zst | sort -V | tail -1)" -C / usr/lib/modules
          git config --system init.defaultBranch main
          # (Ubuntu's host lets no unprivileged user namespace act as root in it: game-focus-audio makes them)
          [ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] ||
            echo 0 >/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          # (the AUR sandbox's network, pasta: it opens its child's user namespace, which Ubuntu's ptrace and AppArmor
          # limits refused ("Couldn't open user namespace ... Permission denied"); and /dev/net/tun in it)
          for k in kernel/yama/ptrace_scope kernel/apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/$k ] || echo 0 >/proc/sys/$k
          done
          # (the runner's AppArmor profile for passt/pasta, Ubuntu's, attaches to the container's pasta by its path and
          # refuses it here: unloaded on this throwaway runner, said which)
          a=/sys/kernel/security/apparmor
          [ -d $a ] || mount -t securityfs securityfs /sys/kernel/security 2>/dev/null || true
          if [ -r $a/profiles ]; then
            for n in $(awk '{ print $1 }' $a/profiles | grep -E 'pas(st|ta)' || true); do
              echo "AppArmor profile $n unloaded (pasta)"; printf '%s' "$n" >$a/.remove || echo "  (couldn't be)"
            done
          fi
          [ -c /dev/net/tun ] || { mkdir -p /dev/net && mknod /dev/net/tun c 10 200; }
          chmod 666 /dev/net/tun
      # (no token left in .git/config: the checkout is the ci user's, and this job runs what the repo job built)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The upstream gate's packages (agros-gate.conf) at Arch's versions, read before anything built is here: the
      # tests run this run's builds as root, which could make the approved step's list below say anything. The
      # release approves only those both lists have (one Arch moved on during the tests: neither). One not in Arch's
      # repos (renamed, dropped) fails here, not left out of the list, which held the whole set on every machine
      - name: Gated versions (before anything built is here)
        id: gated
        shell: bash
        run: |
          read -ra gated < <(sed -n 's/^[[:space:]]*IgnorePkg[[:space:]]*=[[:space:]]*//p' packages/agros-system/agros-gate.conf | paste -sd' ')
          pacman -S --needed --noconfirm "${gated[@]}" >/dev/null
          { echo 'gated<<EOF'
            for p in "${gated[@]}"; do v=$(pacman -Q "$p"); v=${v#* }; echo "$p ${v%-*}"; done
            echo EOF; } >>"$GITHUB_OUTPUT"
      - name: Caelestia (from the published [agros] repo) and its dots' shortcuts, for the tests that check against it
        run: |
          pacman-key --init
          pacman-key --add ci/agros.asc
          pacman-key --lsign-key BFE9289F7759E521AE60CFCD23B6096B42D05E1E
          # (signatures checked when there (the published repo's, a kept package's), not required: this run's new builds are
          # unsigned until the release job signs what passed)
          printf '\n[agros]\nSigLevel = Optional TrustedOnly\nServer = https://crimzoagra.github.io/agros/$arch\n' >>/etc/pacman.conf
          pacman -Sy --noconfirm --needed caelestia-shell
          # (the dots' commit agros-hyprland-settings pins)
          dots=$(sed -n 's/^_dots=//p' packages/agros-hyprland-settings/PKGBUILD)
          git init -q /tmp/dots && git -C /tmp/dots fetch -q --depth 1 https://github.com/caelestia-dots/caelestia "$dots"
          git -C /tmp/dots checkout -q FETCH_HEAD
      - name: Shellcheck (AgrOS's own scripts and package scripts, the tests)
        run: |
          # Every shell script in .local, the packages, system/ and ci/ (by its shebang, so a new one is never left out; a
          # sourced .sh has none), and the session's environment files (sh, sourced by uwsm)
          scripts=()
          while IFS= read -r -d '' f; do
            { [[ $f == *.sh ]] || head -n1 "$f" | grep -qE '^#!.*(/|env )(ba|da)?sh( |$)'; } && scripts+=("$f")
          done < <(find .local/bin .local/share packages system ci -type f -print0)
          shellcheck -S warning "${scripts[@]}" .config/uwsm/env.d/*.sh
          # The tests (their own .shellcheckrc: what they source followed)
          shellcheck -S warning tests/*.sh tests/fixtures/*.sh
          # (pacman's install scriptlets, mkinitcpio's install hook and drop-in: bash, with no shebang to go by)
          shellcheck -S warning -s bash packages/*/*.install packages/agros-boot/{plymouth-title-font,mkinitcpio-plymouth.conf,mkinitcpio-snapshot-overlay.conf}
          # The PKGBUILDs (bash, sourced by makepkg: its variables set or read by it, its functions run in $srcdir)
          shellcheck -S warning -s bash -e SC2034,SC2154,SC2164 packages/*/PKGBUILD
      - uses: actions/download-artifact@v8
        if: needs.repo.result == 'success'
        with:
          name: built
          path: /tmp/built
      - name: Tests, as a normal user
        id: tests
        shell: bash
        env:
          AGROS_TEST_REPORT: /tmp/report/report
        run: |
          useradd -m ci
          install -Dm644 -o ci -g ci /tmp/dots/hypr/variables.lua /home/ci/.config/hypr/variables.lua
          chown -R ci: .
          runuser -u ci -- git config --global --add safe.directory '*'
          mkdir -p /tmp/report
          if [ -d /tmp/built/x86_64 ]; then
            # (what this run built; the day Arch last passed the tests, published beside the repo. ?t=: the current
            # one, not a copy Pages' CDN keeps up to 10 minutes after a deploy)
            site=https://crimzoagra.github.io/agros/x86_64
            day=$(curl -fsS --retry 3 "$site/agros-arch-ok?t=$(date +%s)" 2>/dev/null) || day=
            ci/test-passes.sh file:///tmp/built/x86_64 "$site" "$day"
          else
            runuser -u ci -- env DOTS_BUILD_TESTS=1 tests/run.sh
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.tests.outcome != 'skipped'
        with:
          name: report
          path: /tmp/report
      # The upstream gate (agros-gate.conf, update-gate): the versions of Hyprland and its libraries every test above
      # passed with, approved for AgrOS's machines (the release job adds those the gated step above read too to the
      # list it publishes). Not when an Arch update broke the tests (hold-upstream): none approved, the list as it was
      - name: Approved upstream versions
        id: approved
        shell: bash
        env:
          RESULT: ${{ steps.tests.outputs.result }}
        run: |
          : >/tmp/approved
          [ "$RESULT" != hold-upstream ] || { echo "An Arch update broke the tests: no version approved"; exit 0; }
          # (every IgnorePkg line, as update-gate reads them; one not installed (renamed, dropped by Arch) fails here,
          # not left out of the list, which held the whole set on every machine)
          read -ra gated < <(sed -n 's/^[[:space:]]*IgnorePkg[[:space:]]*=[[:space:]]*//p' packages/agros-system/agros-gate.conf | paste -sd' ')
          for p in "${gated[@]}"; do
            v=$(pacman -Q "$p") || { echo "::error::$p isn't installed: its version can't be approved"; exit 1; }
            v=${v#* }
            echo "$p ${v%-*}" >>/tmp/approved
          done
          cat /tmp/approved
          { echo 'approved<<EOF'; cat /tmp/approved; echo EOF; } >>"${GITHUB_OUTPUT:-/dev/null}"

  agros:
    # AgrOS's own packages (packages/*), built first in a job of their own where no AUR build script runs: the repo job
    # runs those as root in a privileged container, where one could change an agros-* package (agros-keyring: a key
    # planted) that the release then signs. Their sums are this job's output, which no other job can change (its
    # artifact one could replace); the release signs only these (ci/own-check.sh). Unsigned, with no secret
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - &build-tools
        name: Build tools, and CachyOS's repo (what AgrOS installs on, and paru)
        run: |
          # [multilib] (Steam's 32-bit libraries), as CachyOS has it on
          grep -q '^\[multilib\]' /etc/pacman.conf || printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          sed -i 's/^#*DownloadUser.*/#DownloadUser = alpm/' /etc/pacman.conf
          # (as in the test job: a machine id, and no kernel-modules hook with no systemd running)
          systemd-machine-id-setup >/dev/null
          mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/36-systemd-modules-load.hook
          # (nor DKMS's: an AUR build's dependency pulls in a driver, and with no kernel here its hook's "error:" misled)
          ln -sf /dev/null /etc/pacman.d/hooks/70-dkms-install.hook
          pacman-key --init
          pacman -Sy
          pacman -Su --noconfirm --needed $(pacman -T base-devel git sudo)
          git config --system init.defaultBranch main
          m=https://mirror.cachyos.org/repo/x86_64/cachyos
          curl -fsSL -o /tmp/keyring.pkg "$m/$(curl -fsSL "$m/" | grep -o 'cachyos-keyring-[^"]*\.pkg\.tar\.zst' | sort -V | tail -1)"
          mkdir /tmp/k && bsdtar -xf /tmp/keyring.pkg -C /tmp/k
          pacman-key --add /tmp/k/usr/share/pacman/keyrings/cachyos.gpg
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
          # (the keyring and the mirror list then installed from [cachyos] itself, their signatures by that key required:
          # pacman -U of a downloaded file checked none, and ran its install script as root)
          sed -i '/^\[core\]/i [cachyos]\nServer = '"$m"'\n' /etc/pacman.conf
          pacman -Sy --noconfirm cachyos-keyring cachyos-mirrorlist
          sed -i "s|^Server = $m\$|Include = /etc/pacman.d/cachyos-mirrorlist|" /etc/pacman.conf
          pacman -Sy --noconfirm
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # (the packages' versions count the commits)
          persist-credentials: false
      - name: Build AgrOS's own packages
        env:
          AGROS_PUBLISHED: ${{ vars.AGROS_PUBLISHED || 'https://crimzoagra.github.io/agros/x86_64' }}
          AGROS_SKIP_AUR: 1
        run: |
          git config --global --add safe.directory '*'
          ci/build-repo.sh out/x86_64
      - name: Their sums
        id: sums
        shell: bash
        run: |
          cd out/x86_64
          { echo 'sums<<EOF'; for f in agros-*.pkg.tar*; do [[ $f == *.sig ]] || sha256sum "$f"; done; echo EOF; } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: agros
          path: out/x86_64/agros-*

  repo:
    # The [agros] pacman repo: built on every push to main and daily (what doesn't build: the published one kept,
    # build-repo.sh), then tested and published by the jobs below. AgrOS's own packages from the agros job. Unsigned,
    # with no secret: it runs AUR build scripts (only AgrOS's public key, ci/agros.asc, to check the published files it
    # keeps)
    needs: agros
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - *build-tools
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # (the packages' versions count the commits)
          # (no token left in .git/config for the AUR build scripts to read)
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: agros
          path: out/x86_64
      - name: Build the repo
        env:
          # (a repo variable can point it elsewhere: the old repo's copy while this one's site is new)
          AGROS_PUBLISHED: ${{ vars.AGROS_PUBLISHED || 'https://crimzoagra.github.io/agros/x86_64' }}
          AGROS_HELD: /tmp/held/held
          AGROS_SKIP_OWN: 1
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /tmp/held && : >/tmp/held/held
          ci/build-repo.sh out/x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: built
          path: out
      - uses: actions/upload-artifact@v7
        with:
          name: held-build
          path: /tmp/held

  release:
    # What passed the tests put out: this run's new AUR builds swapped for the published ones when they, or an Arch
    # update, broke the tests (build-repo.sh --hold-new); the approved Hyprland list; the day Arch last passed. Then all
    # of it signed (ci/sign-repo.sh), the only place AgrOS's key is: a container of its own, not privileged, that never
    # runs makepkg, paru, an AUR build script, a built package or a test (repo-add reads the packages' .PKGINFO); before
    # the key only official Arch packages' install scripts (its tools), CachyOS's keyring's once the key is gone
    needs: [agros, repo, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Tools
        run: |
          grep -q '^\[multilib\]' /etc/pacman.conf || printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          sed -i 's/^#*DownloadUser.*/#DownloadUser = alpm/' /etc/pacman.conf
          pacman-key --init
          pacman -Sy
          pacman -Su --noconfirm --needed $(pacman -T git sudo)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: built
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: held-build
          path: /tmp/held
      # AgrOS's own packages as the agros job built them, none changed or added by the repo job's AUR build scripts; the
      # rest only ones this run builds, none replacing another package or shipping pacman's keyrings
      - name: AgrOS's own packages checked
        env:
          AGROS_OWN_SUMS: ${{ needs.agros.outputs.sums }}
          AGROS_PUBLISHED: ${{ vars.AGROS_PUBLISHED || 'https://crimzoagra.github.io/agros/x86_64' }}
        run: ci/own-check.sh out/x86_64
      - name: Held back (what broke the tests)
        if: needs.test.outputs.result != 'ok'
        env:
          AGROS_PUBLISHED: ${{ vars.AGROS_PUBLISHED || 'https://crimzoagra.github.io/agros/x86_64' }}
          AGROS_HELD: /tmp/held/held
          AGROS_HOLD_WHY: ${{ needs.test.outputs.result == 'hold-agros' && 'its new build broke AgrOS''s tests (they pass with the published one)' || 'held while an Arch update breaks AgrOS''s tests' }}
        run: |
          git config --global --add safe.directory '*'
          ci/build-repo.sh out/x86_64 --hold-new
      - uses: actions/upload-artifact@v7
        with:
          name: held
          path: /tmp/held
      # The day Arch last passed the tests (ci/test-passes.sh tries an older Arch from it): today's when it did,
      # else the one published before (ci/kept.sh: one that can't be read stops here, as the approved list below)
      - name: The day Arch last passed
        env:
          RESULT: ${{ needs.test.outputs.result }}
        run: |
          if [ "$RESULT" = ok ] || [ "$RESULT" = hold-agros ]; then
            date -u +%Y/%m/%d >out/x86_64/agros-arch-ok
          else
            ci/kept.sh https://crimzoagra.github.io/agros/x86_64/agros-arch-ok out/x86_64/agros-arch-ok
          fi
      # The upstream gate's list (update-gate reads it beside the repo's database): this run's approvals added to those
      # published before (a machine on a CachyOS build a day behind Arch's still finds its version), the last 20 of
      # each. This run's: those the test job read before anything built was there (GATED) that the tests then passed
      # with (APPROVED: read after the builds ran as root there, so only a check on GATED, never a version of its own)
      - name: Approved upstream versions
        env:
          # (this repo's own site, where the list is published: not AGROS_PUBLISHED, which may name an older repo's)
          OWNER: ${{ github.repository_owner }}
          RESULT: ${{ needs.test.outputs.result }}
          GATED: ${{ needs.test.outputs.gated }}
          APPROVED: ${{ needs.test.outputs.approved }}
        shell: bash
        run: |
          site=https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/x86_64
          # (only "not published yet", a 404, starts it afresh: anything else (Pages down, a timeout) stops here rather
          # than publishing a list without the earlier approvals, which held machines a build behind: ci/kept.sh)
          ci/kept.sh "$site/agros-approved" /tmp/approved-before
          now=
          if [ "$RESULT" = ok ] || [ "$RESULT" = hold-agros ]; then
            now=$(grep -xF -f <(printf '%s\n' "$APPROVED") <<<"$GATED") || true
          fi
          cat /tmp/approved-before - <<<"$now" | grep -E '^[a-z0-9@._+-]+ [A-Za-z0-9.:_+~]+$' |
            awk '!seen[$0]++' | tac | awk '++n[$1] <= 20' | tac >out/x86_64/agros-approved
          cat out/x86_64/agros-approved
      # Signed: each new package (one kept as published keeps its signature), the database, the approved list and the
      # day Arch last passed (update-gate and agros-iso check the list's .sig against AgrOS's key). The secret (AgrOS's
      # primary key or a signing subkey of it, either) in this step alone
      - name: Signed
        env:
          AGROS_GPG_KEY: ${{ secrets.AGROS_GPG_KEY }}
        shell: bash
        run: |
          [ -n "$AGROS_GPG_KEY" ] || { echo "::error::Add the AGROS_GPG_KEY secret (AgrOS's key, or a signing subkey of it, without a passphrase)"; exit 1; }
          # (the key gone when this step ends, signed or not, its agent stopped: nothing after it can read it)
          trap 'gpgconf --kill all; rm -rf "$(gpgconf --list-dirs homedir)"' EXIT
          echo "$AGROS_GPG_KEY" | gpg --batch --import
          ci/sign-repo.sh out/x86_64
      - name: CachyOS's repo (the install check resolves AgrOS as installed)
        run: |
          m=https://mirror.cachyos.org/repo/x86_64/cachyos
          curl -fsSL -o /tmp/keyring.pkg "$m/$(curl -fsSL "$m/" | grep -o 'cachyos-keyring-[^"]*\.pkg\.tar\.zst' | sort -V | tail -1)"
          mkdir /tmp/k && bsdtar -xf /tmp/keyring.pkg -C /tmp/k
          pacman-key --add /tmp/k/usr/share/pacman/keyrings/cachyos.gpg
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
          # (the keyring and the mirror list then installed from [cachyos] itself, their signatures by that key required:
          # pacman -U of a downloaded file checked none, and ran its install script as root)
          sed -i '/^\[core\]/i [cachyos]\nServer = '"$m"'\n' /etc/pacman.conf
          pacman -Sy --noconfirm cachyos-keyring cachyos-mirrorlist
          sed -i "s|^Server = $m\$|Include = /etc/pacman.d/cachyos-mirrorlist|" /etc/pacman.conf
          pacman -Sy --noconfirm
      - name: Install check (agros-desktop resolves in one transaction, none of what AgrOS leaves out; with CachyOS's CPU-optimised repos too)
        run: |
          # (with signatures required, as users have it)
          pacman-key --add ci/agros.asc
          pacman-key --lsign-key BFE9289F7759E521AE60CFCD23B6096B42D05E1E
          printf '\n[agros]\nServer = file://%s/out/x86_64\n' "$PWD" >>/etc/pacman.conf
          pacman -Sy
          pacman -S --noconfirm --print agros-desktop >/tmp/plan 2>&1 || { cat /tmp/plan; exit 1; }
          # (an if, not "! grep": sh -e ignores a negated command's failure, which counted only as the step's last line)
          if grep -E '/(noctalia[^/]*|jack2|firefox|dolphin|kitty|alacritty|cachyos-hello)-[0-9]' /tmp/plan; then exit 1; fi
          # The same on a machine whose CPU has CachyOS's v3 or znver4 repos, which the installer puts above [cachyos]
          # (ci/cpu-repos.sh: resolved, no such CPU needed; a library there at another soname than below it, warned).
          # Not resolving there is said, not a stop: it's CachyOS's repos lagging Arch's (lib32-libffi wanting a libffi
          # cachyos-v3 didn't have yet, 2026-11-17), which machines meet whether this publishes or not, and stopping
          # held every AgrOS fix back until CachyOS caught up
          ci/cpu-repos.sh v3 znver4 ||
            echo "::warning::agros-desktop doesn't resolve with CachyOS's CPU repos above (their lag behind Arch's; this step's log says what): published anyway"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  report:
    # One issue for what this run held back or didn't put out (ci/report.sh), closed once a run puts all out (Pages'
    # deploy too: a release signed but never deployed closed the issue as all out)
    needs: [agros, repo, test, release, publish]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      # (gh has the token from GH_TOKEN: none needed in .git/config, beside the artifacts the build made)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # (each only from a job that ran: a skipped one made none, and the missing artifact showed as an error on the run)
      - uses: actions/download-artifact@v8
        if: needs.release.result != 'skipped'
        continue-on-error: true
        with:
          name: held
          path: /tmp/held
      - uses: actions/download-artifact@v8
        if: needs.test.result != 'skipped'
        continue-on-error: true
        with:
          name: report
          path: /tmp/report
      - name: Said
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.outputs.result }}
          BUILD: ${{ needs.agros.result == 'success' && needs.repo.result || needs.agros.result }}
          RELEASE: ${{ needs.release.result == 'success' && needs.publish.result || needs.release.result }}
          HELD: /tmp/held/held
          REPORT: /tmp/report/report
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/report.sh

  publish:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5

  iso:
    # A new ISO with the packages just published (agros-iso's ISO workflow; it skips when nothing changed)
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Start agros-iso's ISO build
        env:
          GH_TOKEN: ${{ secrets.AGROS_ISO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the AGROS_ISO_TOKEN secret (a token with Actions: read and write on agros-iso)"; exit 1; }
          # Pages' CDN serves the old agros.db for up to ~10 minutes after a deploy: the ISO waits until it lists this
          # commit's packages (agros-system's version, r<commits>.<short hash>, changes with every commit). (The steps'
          # bash runs without pipefail: grep's status alone decides. No grep -q all the same: it would stop tar early,
          # read as a miss were pipefail ever set)
          db=https://crimzoagra.github.io/agros/x86_64/agros.db
          for i in $(seq 40); do
            curl -fsSL --retry 3 "$db" | tar -tzf - 2>/dev/null | grep -E "^agros-system-r[0-9]+\.${GITHUB_SHA::7}[0-9a-f]*-" >/dev/null && break
            [ "$i" = 40 ] && { echo "::error::$db still doesn't list this commit's packages after 20 minutes"; exit 1; }
            sleep 30
          done
          gh workflow run iso.yml -R CrimzoAgra/agros-iso --ref main
