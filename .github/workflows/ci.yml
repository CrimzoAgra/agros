name: CI

on:
  push:
  pull_request:
  # Daily: the AUR packages AgrOS carries rebuilt when they've moved on (and against the latest Arch libraries)
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# One run at a time, the newest push queued behind it (an older one waiting is dropped): runs finishing out of order
# published an older commit over a newer one, and cancelling the running one meant a busy day published nothing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    # (privileged: game-focus-audio's user namespaces)
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Tools the tests use
        run: |
          # (only what isn't there: pacman warns about each one asked for that is). Node, qmllint, Hyprland's and
          # Thunar's headers with a compiler (hyprbars and the Thunar plugin built), mkinitcpio, bubblewrap and passt
          # (the boot's AUR sandbox and its network, checked for real: the host's loopback out of its reach): the tests
          # that check against them
          pkgs=(git jq python python-gobject python-numpy python-xlib python-secretstorage gnupg shellcheck sudo libnotify
            procps-ng util-linux which diffutils pacman-contrib file gtk3 thunar lua lutris nodejs qt6-declarative hyprland
            base-devel mkinitcpio bubblewrap passt)
          # (a machine id: without one systemd's install hooks warn that /etc isn't set up; and its hook that loads a
          # package's kernel modules off: no systemd running here, it fails)
          systemd-machine-id-setup >/dev/null
          mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/36-systemd-modules-load.hook
          pacman -Sy
          pacman -Su --noconfirm --needed $(pacman -T "${pkgs[@]}")
          # A kernel's modules for nvidia-early, unpacked rather than installed: its install hook builds an initramfs,
          # which fails in a container
          pacman -Sw --noconfirm linux >/dev/null
          bsdtar -xf "$(ls /var/cache/pacman/pkg/linux-[0-9]*.pkg.tar.zst | sort -V | tail -1)" -C / usr/lib/modules
          git config --system init.defaultBranch main
          # (Ubuntu's host lets no unprivileged user namespace act as root in it: game-focus-audio makes them)
          [ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] ||
            echo 0 >/proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - uses: actions/checkout@v7
      - name: Caelestia (from the published [agros] repo) and its dots' shortcuts, for the tests that check against it
        run: |
          pacman-key --init
          pacman-key --add ci/agros.asc
          pacman-key --lsign-key BFE9289F7759E521AE60CFCD23B6096B42D05E1E
          printf '\n[agros]\nServer = https://crimzoagra.github.io/agros/$arch\n' >>/etc/pacman.conf
          pacman -Sy --noconfirm --needed caelestia-shell
          # (the dots' commit agros-hyprland-settings pins)
          dots=$(sed -n 's/^_dots=//p' packages/agros-hyprland-settings/PKGBUILD)
          git init -q /tmp/dots && git -C /tmp/dots fetch -q --depth 1 https://github.com/caelestia-dots/caelestia "$dots"
          git -C /tmp/dots checkout -q FETCH_HEAD
      - name: Shellcheck (AgrOS's own scripts and package scripts, the tests)
        run: |
          # Every shell script in .local/bin and the data folders (by its shebang; a sourced .sh has none), and the
          # session's environment files (sh, sourced by uwsm)
          scripts=()
          for f in .local/bin/* .local/share/*/*; do
            [[ -f $f ]] && { [[ $f == *.sh ]] || head -n1 "$f" | grep -qE '^#!.*(/|env )(ba|da)?sh( |$)'; } && scripts+=("$f")
          done
          shellcheck -S warning "${scripts[@]}" .config/uwsm/env.d/*.sh ci/build-repo.sh \
            packages/agros-boot/{boot-menu,boot-loader} \
            packages/agros-boot/splash-theme packages/agros-boot/grub-theme/make.sh packages/agros-system/auto-update \
            packages/agros-system/auto-update-aur packages/agros-system/agros-branding \
            system/bluetooth-resume system/screens-resume system/wired-link-watch packages/agros-greeter/{run,login-reset,hyprland-session}
          # The tests (their own .shellcheckrc: what they source followed)
          shellcheck -S warning tests/*.sh
          # (pacman's install scriptlets, mkinitcpio's install hook and drop-in: bash, with no shebang to go by)
          shellcheck -S warning -s bash packages/*/*.install packages/agros-boot/{plymouth-title-font,mkinitcpio-plymouth.conf}
          # The PKGBUILDs (bash, sourced by makepkg: its variables set or read by it, its functions run in $srcdir)
          shellcheck -S warning -s bash -e SC2034,SC2154,SC2164 packages/*/PKGBUILD
      - name: Tests, as a normal user
        run: |
          useradd -m ci
          install -Dm644 -o ci -g ci /tmp/dots/hypr/variables.lua /home/ci/.config/hypr/variables.lua
          chown -R ci: .
          runuser -u ci -- git config --global --add safe.directory '*'
          runuser -u ci -- env DOTS_BUILD_TESTS=1 tests/run.sh

  repo:
    # The [agros] pacman repo: built on every push to main and daily, published on GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Build tools, and CachyOS's repo (what AgrOS installs on, and paru)
        run: |
          # [multilib] (Steam's 32-bit libraries), as CachyOS has it on
          grep -q '^\[multilib\]' /etc/pacman.conf || printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          sed -i 's/^#*DownloadUser.*/#DownloadUser = alpm/' /etc/pacman.conf
          # (as in the test job: a machine id, and no kernel-modules hook with no systemd running)
          systemd-machine-id-setup >/dev/null
          mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/36-systemd-modules-load.hook
          pacman-key --init
          pacman -Sy
          pacman -Su --noconfirm --needed $(pacman -T base-devel git sudo)
          git config --system init.defaultBranch main
          m=https://mirror.cachyos.org/repo/x86_64/cachyos
          curl -fsSL -o /tmp/keyring.pkg "$m/$(curl -fsSL "$m/" | grep -o 'cachyos-keyring-[^"]*\.pkg\.tar\.zst' | sort -V | tail -1)"
          curl -fsSL -o /tmp/mirrorlist.pkg "$m/$(curl -fsSL "$m/" | grep -o 'cachyos-mirrorlist-[^"]*\.pkg\.tar\.zst' | sort -V | tail -1)"
          mkdir /tmp/k && bsdtar -xf /tmp/keyring.pkg -C /tmp/k
          pacman-key --add /tmp/k/usr/share/pacman/keyrings/cachyos.gpg
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman -U --noconfirm /tmp/keyring.pkg /tmp/mirrorlist.pkg
          sed -i '/^\[core\]/i [cachyos]\nInclude = /etc/pacman.d/cachyos-mirrorlist\n' /etc/pacman.conf
          pacman -Sy --noconfirm
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # (the packages' versions count the commits)
      - name: Signing key
        env:
          AGROS_GPG_KEY: ${{ secrets.AGROS_GPG_KEY }}
        run: |
          [ -n "$AGROS_GPG_KEY" ] || { echo "::error::Add the AGROS_GPG_KEY secret (the repo's signing key, gpg --armor --export-secret-keys)"; exit 1; }
          echo "$AGROS_GPG_KEY" | gpg --batch --import
          echo "GPGKEY=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" {print $10; exit}')" >>"$GITHUB_ENV"
      - name: Build the repo
        env:
          # (a repo variable can point it elsewhere: the old repo's copy while this one's site is new)
          AGROS_PUBLISHED: ${{ vars.AGROS_PUBLISHED || 'https://crimzoagra.github.io/agros/x86_64' }}
        run: |
          git config --global --add safe.directory '*'
          ci/build-repo.sh out/x86_64
      - name: Install check (agros-desktop resolves in one transaction, none of what AgrOS leaves out)
        run: |
          # (build-repo.sh added [agros] unchecked while building: now with signatures required, as users have it)
          sed -i '/^\[agros\]$/,/^Server/{/^SigLevel/d}' /etc/pacman.conf
          pacman -Sy
          pacman -S --noconfirm --print agros-desktop >/tmp/plan 2>&1 || { cat /tmp/plan; exit 1; }
          ! grep -E '/(noctalia[^/]*|jack2|firefox|dolphin|kitty|alacritty|cachyos-hello)-[0-9]' /tmp/plan
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  publish:
    needs: repo
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5

  iso:
    # A new ISO with the packages just published (agros-iso's ISO workflow; it skips when nothing changed)
    needs: publish
    runs-on: ubuntu-26.04
    steps:
      - name: Start agros-iso's ISO build
        env:
          GH_TOKEN: ${{ secrets.AGROS_ISO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the AGROS_ISO_TOKEN secret (a token with Actions: read and write on agros-iso)"; exit 1; }
          # Pages' CDN serves the old agros.db for up to ~10 minutes after a deploy: the ISO waits until it lists this
          # commit's packages (agros-system's version, r<commits>.<short hash>, changes with every commit). (The steps'
          # bash runs without pipefail: grep's status alone decides. No grep -q all the same: it would stop tar early,
          # read as a miss were pipefail ever set)
          db=https://crimzoagra.github.io/agros/x86_64/agros.db
          for i in $(seq 40); do
            curl -fsSL --retry 3 "$db" | tar -tzf - 2>/dev/null | grep -E "^agros-system-r[0-9]+\.${GITHUB_SHA::7}[0-9a-f]*-" >/dev/null && break
            [ "$i" = 40 ] && { echo "::error::$db still doesn't list this commit's packages after 20 minutes"; exit 1; }
            sleep 30
          done
          gh workflow run iso.yml -R CrimzoAgra/agros-iso --ref main
