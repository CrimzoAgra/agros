name: Mirror

# The [agros] repo's second server: what GitHub Pages publishes, copied to Cloudflare R2 after each CI run on main
# (ci/mirror.sh), so a Pages outage doesn't stop every AgrOS machine's updates. pacman.conf lists Pages first,
# then https://pub-f1a3a482900748e8b69cd81361ab96e1.r2.dev/repo/$arch (agros-iso's pacman.conf files; agros-system's
# install on machines installed before). The same bucket as agros-iso's ISO (agros-latest.iso at its root): the
# repo under repo/x86_64, the current set only (R2's free 10 GB). Secrets, as agros-iso's: R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (a token for that bucket, read and write), R2_BUCKET. Without them it says so
# and stops, nothing done
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# (one at a time, each run mirroring what Pages has when it starts: a newer one waits, nothing cut off mid-upload)
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # (CI's runs on main, a pull request's publish nothing. One that failed too: Pages may have been deployed before a
    # later job failed (the ISO's start, say), and the mirror then stayed a publish behind; one that published nothing
    # copies what's there again, rclone sending nothing that hasn't changed)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: The R2 secrets
        id: secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::No mirror: add the R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET secrets (agros-iso's)"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          persist-credentials: false
      # (before any secret is in the environment: an upgrade here runs official Arch packages' install scripts)
      - name: The tools
        if: steps.secrets.outputs.ok == 'true'
        run: pacman -Syu --noconfirm --needed gnupg rclone
      # (a few tries: Pages' CDN can serve an older database for minutes after a deploy, its packages gone)
      - name: The published repo, its signatures checked
        if: steps.secrets.outputs.ok == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          site=https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/x86_64
          for i in 1 2 3; do
            rm -rf /tmp/repo /tmp/repo.*
            ci/mirror.sh fetch "$site" /tmp/repo ci/agros.asc && exit 0
            [ "$i" = 3 ] || sleep 120
          done
          exit 1
      - name: Upload to R2
        if: steps.secrets.outputs.ok == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ci/mirror.sh upload /tmp/repo "r2:$R2_BUCKET/repo/x86_64"
