# Hyprland's own start (uwsm's unit for it) with the vmw-dmabuf shim, in VMware only (its vmwgfx driver loaded). Here
# and not in uwsm's env.d, which hands every variable to the user's systemd: every app uwsm starts loaded it too
# (32-bit ones printed ld.so's errors). hypr-vars.lua takes it out again for the apps Hyprland starts itself
# Only its environment, never ExecStart: uwsm's own drop-in (50_custom.conf: Hyprland's command) sorts before this one,
# and a reset here dropped it. A file written before the start and read for it (systemd reads EnvironmentFile= for
# each command, once the one before has ended), none outside VMware; the session's LD_PRELOAD kept, the shim in it once
# ($$: systemd's escape for a $ that reaches sh)
[Service]
ExecStartPre=/bin/sh -c 'f=%t/agros-vmw-dmabuf.env p=/usr/lib/agros/vmw-dmabuf.so; if [ ! -e /sys/module/vmwgfx ]; then rm -f "$$f"; exit 0; fi; case ":$$LD_PRELOAD:" in *":$$p:"*) v=$$LD_PRELOAD ;; *) v=$$p$${LD_PRELOAD:+:$$LD_PRELOAD} ;; esac; echo "LD_PRELOAD=$$v" >"$$f"'
EnvironmentFile=-%t/agros-vmw-dmabuf.env
