# agros-boot: the splash in the boot image, so it's up from the start of the boot (its text behind it), where the
# install left Plymouth's hook out (a CachyOS installed without it). Before an encrypt hook (its password asked on the
# splash), else last (a systemd boot image orders it by its units anyway)
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
    # (an older mkinitcpio.conf's HOOKS="base udev ...", a string: one word each first, or it stays one, encrypt unseen)
    read -ra HOOKS <<<"${HOOKS[*]}"
    _agros_i=${#HOOKS[@]}
    for _agros_h in "${!HOOKS[@]}"; do
        [[ ${HOOKS[_agros_h]} == encrypt || ${HOOKS[_agros_h]} == sd-encrypt ]] && { _agros_i=$_agros_h; break; }
    done
    HOOKS=("${HOOKS[@]:0:_agros_i}" plymouth "${HOOKS[@]:_agros_i}")
    unset _agros_i _agros_h
fi
