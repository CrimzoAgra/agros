# agros-boot: a snapshot booted from the boot menu (a read-only Btrfs subvolume) made writable in RAM, as grub-btrfs's
# hook does: read-only, the desktop couldn't log in on it. CachyOS's grub-btrfs-support puts
# grub-btrfs-overlayfs in mkinitcpio.conf, but its installer writes HOOKS again after it, without it; and that one is
# busybox's, run by no systemd boot image (CachyOS's installer's since 25.11). So on a Btrfs root, where HOOKS has none
# that a boot image of its kind runs: AgrOS's own in a systemd one (agros-snapshot-overlay), else grub-btrfs's, where
# it's installed
read -ra _agros_l <<<"${HOOKS[*]}"
_agros_o=
for _agros_h in "${_agros_l[@]}"; do
    case $_agros_h in
        agros-snapshot-overlay) _agros_o=1 ;;
        grub-btrfs-overlayfs | btrfs-overlayfs) [[ " ${_agros_l[*]} " == *" systemd "* ]] || _agros_o=1 ;;
    esac
done
if [[ -z $_agros_o && $(findmnt -no FSTYPE / 2>/dev/null) == btrfs ]]; then
    if [[ " ${_agros_l[*]} " == *" systemd "* ]]; then
        HOOKS=("${_agros_l[@]}" agros-snapshot-overlay)
    elif [[ -e /usr/lib/initcpio/install/grub-btrfs-overlayfs ]]; then
        HOOKS=("${_agros_l[@]}" grub-btrfs-overlayfs)
    fi
fi
unset _agros_l _agros_o _agros_h
