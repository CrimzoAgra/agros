# AgrOS's upstream gate (included by pacman.conf): the packages AgrOS's desktop is written against, held back from
# every pacman run. AgrOS's own updates (at boot and shutdown, and the Updates app) update them once AgrOS's CI has
# checked the new version (/usr/lib/agros/bin/update-gate). Hyprland and the libraries it's built on, updated together
# (hyprtoolkit too: two of them, hyprland-guiutils and the portal, need it, and it pins those libraries' versions)
IgnorePkg = hyprland aquamarine hyprutils hyprlang hyprcursor hyprgraphics hyprwire hyprtoolkit hyprland-guiutils xdg-desktop-portal-hyprland
