# AgrOS: in a VMware VM, its screen follows the window (resized, full screen). VMware's tools pass the size on to a
# Wayland desktop only with resolutionKMS on (off by default); vm-screen-follow then has Hyprland take it
# (without it the screen stayed at 1280x800 and the desktop looked too big). Read only by VMware's tools.
[resolutionKMS]
enable=true
