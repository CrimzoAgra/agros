# AgrOS: files no one uses on an AgrOS desktop, never unpacked by pacman (included by pacman.conf; agros-system's). On a
# machine installed before this, each package's go at its next update. agros-iso's agros-trim.sh puts the same list in
# the ISO's installed pacman.conf, for the packages installed before agros-system: keep the two the same.
# - docs and help pages: nothing on AgrOS reads them, and there's no help viewer (yelp); fish's are kept (its `help`
#   opens them), HPLIP's (its toolbox's Help button)
# - the font styles nothing names: the terminal's and the window groups' "JetBrains Mono Nerd Font" / "JetBrains Mono
#   NF" are the JetBrainsMonoNerdFont-* files, the shell's "CaskaydiaCove NF" the CaskaydiaCoveNerdFont-* ones, every
#   icon "Material Symbols Rounded"
# - Hyprland's own wallpapers (Caelestia's dots set disable_hyprland_logo; Caelestia draws its own)
# - the pointer's 11 other Bibata styles (~295 MiB): the desktop's and the login screen's is Bibata-Modern-Ice
#   (hypr-vars.lua, agros-greeter's run). Another Bibata style set by hand would find no theme there
# (a file's last matching pattern decides, `!` unpacks it after all, * matches / too: each `!` after its pattern)
NoExtract = usr/share/doc/* !usr/share/doc/fish/* !usr/share/doc/hplip*/* usr/share/help/* usr/share/gtk-doc/*
NoExtract = usr/share/fonts/TTF/JetBrainsMonoNerdFontMono-* usr/share/fonts/TTF/JetBrainsMonoNerdFontPropo-* usr/share/fonts/TTF/JetBrainsMonoNL*
NoExtract = usr/share/fonts/TTF/CaskaydiaCoveNerdFontMono-* usr/share/fonts/TTF/CaskaydiaCoveNerdFontPropo-*
NoExtract = usr/share/fonts/TTF/MaterialSymbolsOutlined* usr/share/fonts/TTF/MaterialSymbolsSharp*
NoExtract = usr/share/hypr/wall*.png
NoExtract = usr/share/icons/Bibata-* !usr/share/icons/Bibata-Modern-Ice/*
