# The desktop's portals: Hyprland's, then GTK's for the rest (as /usr/share/xdg-desktop-portal/hyprland-portals.conf)...
[preferred]
default=hyprland;gtk
# ...but no "keep the screen on" portal: GTK's is the only one, and it passes requests to a screensaver service this
# desktop doesn't have, so each one failed with errors in the log (every GTK app start, every Lutris game). Apps keep the
# screen on through Hyprland instead (games: their window rule; video: Wayland's idle inhibit)
org.freedesktop.impl.portal.Inhibit=none
