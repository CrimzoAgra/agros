// My changes to LibreWolf's defaults (read on every start; LibreWolf's own settings are in /usr/lib/librewolf/librewolf.cfg)

// Keep cookies, logins and history when it closes (LibreWolf erases them on every quit by default)
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);
// Firefox account and Sync (LibreWolf turns them off)
defaultPref("identity.fxaccounts.enabled", true);
// Sites see dark mode when the desktop is dark. Resist Fingerprinting always says light, and can't make an exception:
// replaced with Firefox's fingerprinting protection, every protection of it on except that one
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
// Hardware video decoding (VA-API; the NVIDIA side is set in ~/.config/uwsm/env.d/nvidia-vaapi.sh)
defaultPref("media.ffmpeg.vaapi.enabled", true);
defaultPref("media.hardware-video-decoding.force-enabled", true);
// No AV1: the RTX 2060 can't decode it in hardware, so YouTube falls back to VP9, which it can
defaultPref("media.av1.enabled", false);
