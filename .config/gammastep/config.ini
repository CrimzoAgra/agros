; Night light (Caelestia's execs.lua starts gammastep at login): warmer screens after sunset, from where geoclue says
; you are (agros-system lets gammastep ask it without a prompt). No location (offline, or geoclue can't find you):
; it waits, untinted. To set it by hand: location-provider=manual, and a [manual] section with lat= and lon=
[general]
location-provider=geoclue2
adjustment-method=wayland
temp-day=6500
temp-night=4000
fade=1
